# --- AGENTE: "agent" ---
# Nombramos los componentes
agent.sources = s1
agent.channels = c1
agent.sinks = k1

# --- SOURCE (s1): SpoolDir ---
# Vigila un directorio en busca de ficheros
agent.sources.s1.type = spooldir
agent.sources.s1.spoolDir = /home/iabd_admin/flume_ingest
agent.sources.s1.fileHeader = true
agent.sources.s1.channels = c1

# --- CHANNEL (c1): Memory ---
# Un buffer en RAM
agent.channels.c1.type = memory
agent.channels.c1.capacity = 1000
agent.channels.c1.transactionCapacity = 100

# --- SINK (k1): HDFS ---
# Escribe los datos en HDFS (en Docker el NameNode se llama "namenode")
agent.sinks.k1.type = hdfs
agent.sinks.k1.hdfs.path = hdfs://namenode:9000/user/iabd_admin/ingesta/weblogs/
agent.sinks.k1.hdfs.fileType = DataStream
agent.sinks.k1.hdfs.writeFormat = Text
agent.sinks.k1.hdfs.rollInterval = 60
agent.sinks.k1.hdfs.rollSize = 0
agent.sinks.k1.hdfs.rollCount = 0
agent.sinks.k1.hdfs.useLocalTimeStamp = true
agent.sinks.k1.channel = c1
